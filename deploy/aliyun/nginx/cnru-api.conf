# Nginx 反向代理 + HTTPS（阿里云 ECS）
# 放到 /etc/nginx/conf.d/cnru-api.conf（或 sites-available/sites-enabled）
# 前提：已把域名解析到本机公网 IP，且已在阿里云申请/上传 SSL 证书（或 certbot）。

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    # 阿里云免费证书路径（下载后放到 /etc/nginx/ssl/）
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 反向代理到本机 8000（systemd 里 gunicorn 监听 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（放行，便于阿里云负载/监控）
    location = /health { proxy_pass http://127.0.0.1:8000; }
}
